<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#213776">
  <title>Welcome to Let's Win a Car!</title>
  <link rel="stylesheet" href="landing.css?v=4">
</head>
<body>
  <main class="welcome">
    <img class="welcome-art" src="assets/concepts/welcome-cast-v1.png" alt="Monty, Haunty, and both superhero contestants smiling in front of three closed prize doors">
    <h1 aria-label="Welcome to Let's Win a Car!">
      <svg viewBox="0 0 1600 350" aria-hidden="true">
        <defs><path id="welcome-arc" d="M 70 310 Q 800 -100 1530 310"/></defs>
        <text><textPath href="#welcome-arc" startOffset="50%" text-anchor="middle">Welcome to Let's Win a Car!</textPath></text>
      </svg>
    </h1>
    <button id="start-game" type="button">Start Game!</button>
    <noscript><p class="launch-help">Please enable JavaScript to view the four games.</p></noscript>
  </main>
  <main id="game-overview" class="game-overview" hidden aria-label="All four game versions">
    <aside class="overview-copy">
      <p>Four different versions of the Lets Win a Car game featuring two different contestants and two different game show hosts. Watch their behavior closely as they play the game over and over. Is it better to switch doors or stay with the one you've got?</p>
      <nav id="game-links" class="game-links" aria-label="Choose a game"></nav>
    </aside>
    <section id="game-grid" class="game-grid" aria-label="Live games"></section>
  </main>
  <script type="module" src="landing.mjs?v=12"></script>
</body>
</html>
